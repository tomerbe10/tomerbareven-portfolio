<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomer Bar Even — Product Manager</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f5;
      color: #161616;
    }

    main {
      text-align: center;
      padding: 32px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 700;
      letter-spacing: -1.5px;
    }

    h2 {
      margin: 0 0 28px;
      font-size: 20px;
      font-weight: 500;
      color: #555;
    }

    p {
      margin: 0;
      font-size: 15px;
      color: #777;
    }
  </style>
</head>

<body>
  <main>
    <h1>Tomer Bar Even</h1>
    <h2>Product Manager</h2>
    <p>Portfolio coming soon.</p>
  </main>
</body>
</html>
